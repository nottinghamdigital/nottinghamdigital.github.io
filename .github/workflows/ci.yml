name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the release reminder below diffs against the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validates every meetup YAML file against the content schema, so a
      # malformed contribution fails the PR rather than the deploy.
      - run: npm run build

      - name: Check the custom domain survived the build
        run: |
          test -f dist/CNAME
          grep -qx 'nottingham.digital' dist/CNAME

      # deploy.yml cuts a release only when package.json's version changes, so
      # a code change merged without a bump is published but never tagged.
      # This is a nudge, not a gate: content-only PRs are the common case and
      # have no business bumping a version, and a contributor should never see
      # a red check for it.
      - name: Remind about the version bump
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head_version=$(jq -r .version package.json)
          base_version=$(git show "origin/$BASE:package.json" | jq -r .version)

          # Anything outside the meetup listings counts as a code change.
          code_changes=$(git diff --name-only "origin/$BASE...HEAD" \
            | grep -v '^src/content/meetups/' || true)

          if [ -n "$code_changes" ] && [ "$head_version" = "$base_version" ]; then
            echo "::notice::This PR changes site code but leaves package.json at $head_version — merging it will deploy, but will not cut a tag or release. Bump the version if this change is worth one."
          fi
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs vitest (tests/{unit,integration}/**/*.test.ts). No browser, no build — pure Node.
      - run: npm run test:unit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache the chromium binary keyed on the Playwright package version —
      # the browser is pinned to the @playwright/test release, so the lockfile
      # hash is the right cache key.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only chromium: the suite declares a single project, so installing the
      # other engines would add a couple of minutes for nothing.
      - run: npx playwright install --with-deps chromium

      # `webServer` builds the site and serves dist/, so there is no separate
      # build step here — the tests run against the published artefact.
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # lighthouserc.json serves dist/ with the same script Playwright uses, so
      # the audit runs against the artefact GitHub Pages publishes. The action
      # brings its own Lighthouse CI rather than the repo carrying it as a
      # devDependency — @lhci/cli pulls in a puppeteer tree this site has no
      # other use for. `npm run lighthouse` runs the same config locally.
      #
      # continue-on-error is temporary: the thresholds in lighthouserc.json
      # have never been measured against this site, so a wrong guess would
      # fail PRs for a pre-existing condition rather than a regression. The
      # first run prints the real category scores — set the thresholds from
      # them and delete this line to make the budgets binding.
      #
      # Pinned to a commit rather than the v12 tag: this is the only
      # third-party action in the repo, tags are mutable, and it runs
      # arbitrary code in the runner.
      - name: Lighthouse budgets
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json

      # Always, not just on failure: the report is what the thresholds get
      # calibrated from.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/reports/
          retention-days: 7
