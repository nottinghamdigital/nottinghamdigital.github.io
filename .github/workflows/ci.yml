name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validates every meetup YAML file against the content schema, so a
      # malformed contribution fails the PR rather than the deploy.
      - run: npm run build

      - name: Check the custom domain survived the build
        run: |
          test -f dist/CNAME
          grep -qx 'nottingham.digital' dist/CNAME

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only chromium: the suite declares a single project, so installing the
      # other engines would add a couple of minutes for nothing.
      - run: npx playwright install --with-deps chromium

      # `webServer` builds the site and serves dist/, so there is no separate
      # build step here — the tests run against the published artefact.
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
