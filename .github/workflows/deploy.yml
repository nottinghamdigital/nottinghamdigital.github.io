name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuilds and republishes daily even with no new commits, so the next-event
    # data in scripts/fetch-next-events.mjs (run via the `prebuild` script)
    # doesn't go stale. Times are UTC.
    - cron: '0 6 * * *'

# Least privilege needed for the Pages deployment to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Gate the deploy on the same test jobs ci.yml runs on PRs, so a direct
  # push, an admin merge, or the daily cron can't republish a broken build.
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:unit

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [build, unit, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A release marks what is live: it runs after deploy succeeds, and only on
  # pushes — the daily cron rebuild republishes identical content, so tagging it
  # would add a release a day for no change. package.json's version is the
  # trigger: bump it in a PR and merging cuts the release, leave it alone and
  # this job is a no-op.
  release:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Overrides the workflow-level permissions: this job creates a tag and a
    # release, and needs nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # jq rather than `node -p "require(...)"` — package.json sets
      # "type": "module", which makes the node one-liner awkward.
      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Checking for the release rather than the tag keeps re-runs
          # idempotent, and self-heals if a tag exists without a release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released — skipping."
            exit 0
          fi

          # gh creates the tag at --target when it doesn't already exist, so
          # there is no separate `git tag && git push` step to keep in sync.
          # Notes are grouped by the categories in .github/release.yml.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
