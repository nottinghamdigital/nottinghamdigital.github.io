name: review-policy

# Enforces the repo review rules:
#   - Content-only PRs (changes only under src/content/meetups/**) need at
#     least 1 approving review from someone with write access.
#   - Any PR touching files outside src/content/meetups/** ("architectural /
#     feature changes") needs at least 2 approving reviews from users with
#     write access.
# To make this binding, add a required status check named "review-policy" to
# the branch ruleset for main. Until that is done this job only reports.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-policy-${{ github.event.pull_request.number || github.event.pull_request.id }}
  cancel-in-progress: true

jobs:
  review-policy:
    name: review-policy
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate review policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Fetch changed files (paginated).
          files=$(gh api --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')

          echo "Changed files:"
          if [ -z "$files" ]; then
            echo "  (none)"
          else
            echo "$files" | sed 's/^/  /'
          fi

          # 2. Classify: content-only if every path is under src/content/meetups/.
          # A PR with no file changes is treated as non-content (safer default —
          # an empty diff shouldn't skip the higher bar).
          non_content=$(echo "$files" | grep -Ev '^src/content/meetups/' || true)
          if [ -n "$files" ] && [ -z "$non_content" ]; then
            required=1
            classification="content-only"
          else
            required=2
            classification="non-content"
            if [ -n "$non_content" ]; then
              echo "Non-content files present:"
              echo "$non_content" | sed 's/^/  /'
            fi
          fi

          # 3. Find each reviewer's current review state. GitHub review history
          # is append-only, so keep only the latest non-COMMENTED review per
          # user — an APPROVED that was later dismissed shows as DISMISSED and
          # so drops out here.
          #
          # --slurp is required with --paginate so all pages arrive as one
          # array; without it gh would apply the filter to each page separately
          # and emit one count per page. --slurp cannot be combined with --jq,
          # so the filter runs in a piped jq instead.
          approvers=$(gh api --paginate --slurp \
            "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            | jq -r '[.[][] | select(.state != "COMMENTED")]
                     | group_by(.user.login)
                     | map(sort_by(.submitted_at) | last)
                     | map(select(.state == "APPROVED") | .user.login)
                     | .[]')

          # 4. Keep only approvers who actually have write access.
          #
          # Deliberately NOT using author_association: that field is resolved
          # relative to what the requesting token can see, and this repo grants
          # write via the nottingham-digital-maintainers team while org
          # membership is private. The repo-scoped Actions token therefore sees
          # every team maintainer as CONTRIBUTOR — never MEMBER (private
          # membership) and never COLLABORATOR (direct collaborators only) — so
          # an association filter counts zero approvals on every PR.
          approvals=0
          for login in $approvers; do
            if ! perm=$(gh api "repos/${REPO}/collaborators/${login}/permission" --jq '.permission'); then
              echo "::error::Could not resolve repository permission for ${login}."
              exit 1
            fi
            echo "Approval from ${login} (permission: ${perm})"
            case "$perm" in
              admin | write) approvals=$((approvals + 1)) ;;
              *) echo "  ignored — no write access" ;;
            esac
          done

          echo "Classification: ${classification} — ${required} approving review(s) required."
          echo "Current approving reviews: ${approvals}"

          if [ "${approvals}" -lt "${required}" ]; then
            echo "::error::This ${classification} PR needs ${required} approving review(s) (has ${approvals})."
            exit 1
          fi

          echo "::notice::Review policy satisfied (${approvals} approvals)."
