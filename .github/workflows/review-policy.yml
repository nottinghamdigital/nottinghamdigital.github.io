name: review-policy

# Enforces the repo review rules:
#   - Every PR needs at least 1 approving review.
#   - Any PR touching files outside src/content/meetups/** ("architectural /
#     feature changes") needs at least 2 approving reviews from users with
#     write access.
# Wired into the branch ruleset as a required status check named "review-policy"
# so the merge button stays disabled until this check passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-policy-${{ github.event.pull_request.number || github.event.pull_request.id }}
  cancel-in-progress: true

jobs:
  review-policy:
    name: review-policy
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate review policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Fetch changed files (paginated).
          files=$(gh api --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')

          echo "Changed files:"
          if [ -z "$files" ]; then
            echo "  (none)"
          else
            echo "$files" | sed 's/^/  /'
          fi

          # 2. Classify: content-only if every path is under src/content/meetups/.
          # A PR with no file changes is treated as non-content (safer default —
          # an empty diff shouldn't skip the higher bar).
          non_content=$(echo "$files" | grep -Ev '^src/content/meetups/' || true)
          if [ -n "$files" ] && [ -z "$non_content" ]; then
            required=1
            classification="content-only"
          else
            required=2
            classification="non-content"
            if [ -n "$non_content" ]; then
              echo "Non-content files present:"
              echo "$non_content" | sed 's/^/  /'
            fi
          fi

          # 3. Count approving reviews. GitHub review history is append-only,
          # so keep only each reviewer's latest non-COMMENTED review state.
          # An APPROVED that is later dismissed shows as DISMISSED and won't count.
          approvals=$(gh api --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state != "COMMENTED")]
                  | group_by(.user.login)
                  | map(sort_by(.submitted_at) | last)
                  | map(select(.state == "APPROVED"))
                  | length')

          echo "Classification: ${classification} — ${required} approving review(s) required."
          echo "Current approving reviews: ${approvals}"

          if [ "${approvals}" -lt "${required}" ]; then
            echo "::error::This ${classification} PR needs ${required} approving review(s) (has ${approvals})."
            exit 1
          fi

          echo "::notice::Review policy satisfied (${approvals} approvals)."
